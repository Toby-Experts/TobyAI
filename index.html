<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TobyAI</title>
<meta name="description" content="TobyAI is coming soon. Join the waitlist.">
<meta name="robots" content="noindex">
<meta property="og:title" content="TobyAI">
<meta property="og:description" content="Coming soon. Join the waitlist.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tobyai.io">
<meta property="og:image" content="https://tobyai.io/toby_logo_1024.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="TobyAI logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TobyAI">
<meta name="twitter:description" content="Coming soon. Join the waitlist.">
<meta name="twitter:image" content="https://tobyai.io/toby_logo_1024.png">
<meta name="twitter:image:alt" content="TobyAI logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer data-domain="tobyai.io" src="https://plausible.io/js/script.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:      #1a2535;
    --navy2:     #162030;
    --teal:      #2a9d8f;
    --teal2:     #21867a;
    --teal-glow: #5abfb3;
    --font-head: 'Big Shoulders Display', system-ui, sans-serif;
    --font-body: 'Instrument Sans', system-ui, sans-serif;
  }
  html, body {
    height: 100%; font-family: var(--font-body);
    background: var(--navy2); color: white;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 24px;
    position: relative; overflow: hidden;
  }

  .bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bg-orb { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(42,157,143,0.11) 0%, transparent 68%); }
  .bg-orb.a { width: 900px; height: 900px; top: -300px; left: 50%; transform: translateX(-50%); }
  .bg-orb.b { width: 500px; height: 500px; bottom: -180px; right: -100px; opacity: 0.6; }
  .bg-orb.c { width: 320px; height: 320px; top: 15%; left: -60px; background: radial-gradient(circle, rgba(58,124,165,0.08) 0%, transparent 70%); }
  .bg-grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 70% 55% at 50% 10%, black 0%, transparent 80%);
  }

  .content {
    position: relative; z-index: 1;
    text-align: center; max-width: 460px;
    animation: rise 0.8s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .brand { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 40px; }
  .logo-mark {
    width: 56px; height: 56px; border-radius: 14px;
    background: linear-gradient(135deg, #2a9d8f, #21867a);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head); font-weight: 900; font-size: 30px; color: white;
    box-shadow: 0 0 0 1px rgba(42,157,143,0.35), 0 6px 20px rgba(42,157,143,0.25);
  }
  .logo-text { font-family: var(--font-head); font-weight: 800; font-size: 34px; color: white; letter-spacing: -0.5px; }
  .logo-text span { color: var(--teal-glow); }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(44px, 8vw, 72px);
    font-weight: 900; line-height: 1.05; letter-spacing: -2px;
    color: white; margin-bottom: 18px;
    animation: rise 0.8s 0.1s ease both;
  }
  h1 .accent { color: var(--teal-glow); }

  .tagline {
    font-size: clamp(15px, 2vw, 17px); font-weight: 500;
    color: rgba(255,255,255,0.45); margin-bottom: 40px; line-height: 1.6;
    animation: rise 0.8s 0.15s ease both;
  }

  .form-wrap { max-width: 380px; margin: 0 auto; animation: rise 0.8s 0.2s ease both; }
  .form-field {
    width: 100%; padding: 14px 16px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9px; font-size: 14px; color: white; font-family: var(--font-body);
    outline: none; transition: border-color 0.2s, background 0.2s; margin-bottom: 10px;
  }
  .form-field:focus { border-color: var(--teal); background: rgba(255,255,255,0.08); }
  .form-field::placeholder { color: rgba(255,255,255,0.28); }
  .form-btn {
    width: 100%; padding: 15px; border-radius: 9px;
    background: var(--teal); color: white; border: none;
    font-size: 15px; font-weight: 700; font-family: var(--font-body);
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(42,157,143,0.35);
  }
  .form-btn:hover { background: var(--teal2); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(42,157,143,0.45); }
  .form-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .form-note { font-size: 12px; color: rgba(255,255,255,0.22); margin-top: 12px; }
  .error-msg { font-size: 12px; color: #f87171; margin-bottom: 8px; display: none; }

  .success {
    display: none; text-align: center; padding: 28px 24px;
    background: rgba(42,157,143,0.09); border: 1px solid rgba(42,157,143,0.22);
    border-radius: 14px; max-width: 380px; margin: 0 auto;
  }
  .success-icon { font-size: 32px; margin-bottom: 10px; }
  .success h3 { font-family: var(--font-head); font-size: 24px; font-weight: 800; color: var(--teal-glow); margin-bottom: 8px; }
  .success p { font-size: 14px; color: rgba(255,255,255,0.45); line-height: 1.65; }

  footer {
    position: relative; z-index: 1; margin-top: 48px; text-align: center;
    font-size: 12px; color: rgba(255,255,255,0.2);
    animation: rise 0.8s 0.3s ease both;
  }
  footer a { color: var(--teal-glow); text-decoration: none; }
  footer a:hover { color: white; }
</style>
</head>
<body>

<div class="page">
  <div class="bg">
    <div class="bg-orb a"></div>
    <div class="bg-orb b"></div>
    <div class="bg-orb c"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="content">
    <div class="brand">
      <div class="logo-mark">T</div>
      <span class="logo-text">Toby<span>AI</span></span>
    </div>

    <h1>Coming <span class="accent">soon.</span></h1>

    <p class="tagline">We're building something. Join the waitlist to be first to know.</p>

    <div class="form-wrap">
      <div id="signup-form">
        <input type="email" id="f-email" class="form-field" placeholder="Email address">
        <div class="error-msg" id="form-error">Please enter a valid email address.</div>
        <button class="form-btn" id="form-btn" onclick="submitForm()">Join the Waitlist →</button>
        <p class="form-note">No spam. We'll reach out when we're ready.</p>
      </div>

      <div class="success" id="success-msg">
        <div class="success-icon">✅</div>
        <h3>You're on the list.</h3>
        <p>We'll be in touch when early access opens.</p>
      </div>
    </div>
  </div>

  <footer>
    <a href="mailto:hello@tobyai.io">hello@tobyai.io</a>
    &nbsp;·&nbsp; <a href="/privacy.html">Privacy</a>
    &nbsp;·&nbsp; <a href="/terms.html">Terms</a>
    &nbsp;·&nbsp; © 2026 TobyAI
  </footer>
</div>

<script>
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKahbBF02NvIaMZado7vuzlCKYe0BUHbqxTnwidfGEl94B6kqm3dUxrC9yy1NVPlPF5A/exec';

  function submitForm() {
    var email = document.getElementById('f-email').value.trim();
    var err   = document.getElementById('form-error');
    err.style.display = 'none';
    if (!email || !email.includes('@')) {
      err.style.display = 'block'; return;
    }
    var btn = document.getElementById('form-btn');
    btn.disabled = true; btn.textContent = 'Sending…';
    fetch(SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: '—', business: '—', email: email, type: '—',
        revenue: '—', industry: '—', tier: 'Waitlist',
        submitted: new Date().toISOString()
      })
    }).then(done).catch(done);
  }

  function done() {
    document.getElementById('signup-form').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  }
</script>

</body>
</html>
